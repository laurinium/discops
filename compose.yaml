name: rippymcripface

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-ripper-common: &ripper-common
  image: ${IMAGE_PREFIX:-ghcr.io/laurinium/discops}/ripper:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: apps/ripper/Dockerfile
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  depends_on:
    backend:
      condition: service_healthy
  networks:
    - rippy
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  # Required only for sg_reset-based optical drive reset from the UI.
  cap_add:
    - SYS_ADMIN
  environment:
    BACKEND_GRPC_ADDR: backend:50051
    OUTPUT_DIR: /music
    WORK_DIR: /work
    OUTPUT_FORMAT: ${OUTPUT_FORMAT:-flac}
    AUTO_RIP: ${AUTO_RIP:-true}
    EJECT_ON_SUCCESS: ${EJECT_ON_SUCCESS:-true}
    EJECT_ON_FAILURE: ${EJECT_ON_FAILURE:-false}
    UDEV_MONITOR: ${UDEV_MONITOR:-true}
    POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Set if mounting a custom abcde config, e.g. /etc/abcde.conf
    ABCDE_CONFIG: ${ABCDE_CONFIG:-}
  volumes:
    - type: bind
      source: ${MUSIC_DIR:-./data/music}
      target: /music
    - type: bind
      source: ${WORK_DIR:-./data/work}
      target: /work
    - type: bind
      source: /run/udev
      target: /run/udev
      read_only: true
    # Optional custom abcde config. Uncomment and set ABCDE_CONFIG=/etc/abcde.conf.
    # - type: bind
    #   source: ./docker/abcde.conf
    #   target: /etc/abcde.conf
    #   read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777

services:
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/laurinium/discops}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    init: true
    user: "${PUID:-1001}:${PGID:-1001}"
    stop_grace_period: 30s
    environment:
      BACKEND_HTTP_PORT: "8080"
      BACKEND_GRPC_PORT: "50051"
      DATABASE_PATH: /data/rippy.db
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      EXPECTED_RIPPERS: ${EXPECTED_RIPPERS:-drive-01:/dev/sr0:/dev/sg0,drive-02:/dev/sr1:/dev/sg1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - type: bind
        source: ${BACKEND_DATA_DIR:-./data/backend}
        target: /data
    ports:
      # Browser/API entrypoint. Bind to 127.0.0.1 behind a reverse proxy by setting:
      # BACKEND_HTTP_BIND=127.0.0.1:8080
      - "${BACKEND_HTTP_BIND:-8080}:8080"
    expose:
      - "50051"
    networks:
      - rippy
    logging: *default-logging
    <<: *common-security

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/laurinium/discops}/frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HTTP_BIND:-3000}:8080"
    networks:
      - rippy
    logging: *default-logging
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  ripper-sr0:
    <<: *ripper-common
    environment:
      BACKEND_GRPC_ADDR: backend:50051
      OUTPUT_DIR: /music
      WORK_DIR: /work
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-flac}
      AUTO_RIP: ${AUTO_RIP:-true}
      EJECT_ON_SUCCESS: ${EJECT_ON_SUCCESS:-true}
      EJECT_ON_FAILURE: ${EJECT_ON_FAILURE:-false}
      UDEV_MONITOR: ${UDEV_MONITOR:-true}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ABCDE_CONFIG: ${ABCDE_CONFIG:-}
      RIPPER_ID: ${RIPPER_SR0_ID:-drive-01}
      DRIVE_DEVICE: ${RIPPER_SR0_DEVICE:-/dev/sr0}
      SG_DEVICE: ${RIPPER_SR0_SG_DEVICE:-/dev/sg0}
    devices:
      - "${RIPPER_SR0_DEVICE:-/dev/sr0}:${RIPPER_SR0_DEVICE:-/dev/sr0}"
      # Matching SCSI generic device improves cdparanoia/abcde reliability.
      - "${RIPPER_SR0_SG_DEVICE:-/dev/sg0}:${RIPPER_SR0_SG_DEVICE:-/dev/sg0}"

  # Enable with COMPOSE_PROFILES=sr1 or: docker compose --profile sr1 up -d
  ripper-sr1:
