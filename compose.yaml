      EJECT_ON_SUCCESS: ${EJECT_ON_SUCCESS:-true}
      EJECT_ON_FAILURE: ${EJECT_ON_FAILURE:-false}
      UDEV_MONITOR: ${UDEV_MONITOR:-true}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ABCDE_CONFIG: ${ABCDE_CONFIG:-}
      RIPPER_ID: ${RIPPER_SR1_ID:-drive-02}
      DRIVE_DEVICE: ${RIPPER_SR1_DEVICE:-/dev/sr1}
      SG_DEVICE: ${RIPPER_SR1_SG_DEVICE:-/dev/sg1}
    devices:
      - "${RIPPER_SR1_DEVICE:-/dev/sr1}:${RIPPER_SR1_DEVICE:-/dev/sr1}"
      - "${RIPPER_SR1_SG_DEVICE:-/dev/sg1}:${RIPPER_SR1_SG_DEVICE:-/dev/sg1}"

