services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      BACKEND_HTTP_PORT: "8080"
      BACKEND_GRPC_PORT: "50051"
      DATABASE_PATH: /data/rippy.db
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
    volumes:
      - ./data/backend:/data
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  ripper-sr0:
    build:
      context: .
      dockerfile: apps/ripper/Dockerfile
    environment:
      RIPPER_ID: drive-01
      DRIVE_DEVICE: /dev/sr0
      BACKEND_GRPC_ADDR: backend:50051
      OUTPUT_DIR: /music
      OUTPUT_FORMAT: flac
      AUTO_RIP: "true"
      UDEV_MONITOR: "true"
      LOG_LEVEL: info
    devices:
      - /dev/sr0:/dev/sr0
    volumes:
      - ./data/music:/music
      - /run/udev:/run/udev:ro
      # Optional abcde config:
      # - ./docker/abcde.conf:/etc/abcde.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Uncomment when a second physical drive exists.
